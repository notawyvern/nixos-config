name: Update flake.lock

on:
  schedule:
    - cron: "0 0 * * 3,6" # wednesday and saturday
  workflow_dispatch: # allows manual triggering

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: ossystems/nix-actions/update-flake@v1.0.6
        with:
          install-nix: true
          auto-merge: true